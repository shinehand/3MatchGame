name: No-device Alpha Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-device-alpha-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot no-device validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GODOT_VERSION: 4.6.1
      GODOT_STATUS: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shell dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates curl libgl1 libgl1-mesa-dri libglx-mesa0 libglu1-mesa libxcursor1 libxi6 libxinerama1 libxrandr2 libxrender1 mesa-vulkan-drivers ripgrep unzip xauth xvfb zsh

      - name: Install Godot
        run: |
          set -euo pipefail
          godot_zip="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          godot_bin="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          release_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/${godot_zip}"
          curl -fL --retry 3 --retry-delay 2 "$release_url" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/${godot_bin}" /usr/local/bin/godot
          godot --version

      - name: Stage data validation
        run: zsh scripts/validate_stage_data.sh

      - name: Stage balance validation
        run: zsh scripts/validate_stage_balance.sh

      - name: Analytics contract validation
        run: zsh scripts/validate_analytics_contract.sh

      - name: Provider readiness validation
        run: zsh scripts/validate_provider_readiness.sh

      - name: LiveOps config validation
        run: zsh scripts/validate_liveops_config.sh

      - name: Render snapshot smoke
        continue-on-error: true
        run: zsh scripts/validate_render_snapshots.sh

      - name: Android export config validation
        run: zsh scripts/validate_android_export_config.sh

      - name: Android QA helper contract smoke
        run: zsh scripts/validate_android_qa_helpers_contract.sh

      - name: Full no-device gameplay gate
        run: zsh scripts/validate_gameplay.sh

      - name: Write no-device gate caveats
        if: always()
        run: |
          cat > /tmp/puzzle-no-device-alpha-gate-caveats.md <<'EOF'
          # No-device Alpha Gate Caveats

          This CI run is a readiness gate, not alpha approval.

          Render snapshot smoke is a non-blocking artifact attempt on GitHub-hosted runners,
          and snapshot PNGs may be absent if Xvfb rendering is unavailable. Run
          `zsh scripts/validate_render_snapshots.sh` as a blocking check on a local display
          or supported Xvfb renderer.

          Android QA helper contract smoke validates CLI dry-run safety only; it does not
          create APKs, sign builds, install to a device, or prove real-device evidence.

          LiveOps config validation checks local JSON contracts only; it does not prove
          Firebase Remote Config, backend scheduling, store products, or provider delivery.

          It does not replace:

          - Android real-device portrait and landscape screenshots.
          - Android real-device 10s screen recording and logcat evidence.
          - Sound, haptics, and touch-latency PASS notes from a human tester.
          - Release-keystore signed install and launch evidence.
          - Real Ads, IAP, or Analytics SDK provider behavior with production credentials.

          Final alpha approval still requires a completed manual QA report and evidence packet.
          EOF

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: no-device-alpha-gate-logs
          if-no-files-found: ignore
          path: |
            /tmp/puzzle-*.log
            /tmp/puzzle-*.stdout
            /tmp/puzzle-*.txt
            /tmp/puzzle-*.md
            /tmp/puzzle-render-snapshots/*.png
            /tmp/puzzle-render-snapshots/*.txt
